# weknora.conf —— 212 服务器上 WeKnora 站点（宿主机 nginx，server 片段）
# 部署: 放到 212 的 /etc/nginx/conf.d/weknora.conf（或 sites-available + 软链到 sites-enabled）
#       校验/生效: nginx -t && systemctl reload nginx
#
# 拓扑（复用 7088，公网可直达）:
#   浏览器 → https://intramind.hnhlsa.com:7088 （本文件，SNI=intramind.hnhlsa.com 命中本 server）
#            ├─ 静态前端文件  /etc/nginx/html/intramind   ← 前端 dist 构建产物部署到此目录（212 静态根 /etc/nginx/html 下的站点子目录）
#            └─ /api/ /files /r/ → http://192.168.1.190:8081（190 上 WeKnora app 后端，宿主端口 8081，http）
#
# 静态目录命名：与 e4e 的 /etc/nginx/html/e4e-web 同模式，每站点一个子目录，
#   目录名和站点是否对应完全由本文件里的 root 指定（新建 intramind 目录即可，名字可随意）。
#   部署时在 212 上 mkdir -p /etc/nginx/html/intramind 并把 dist 内容拷进去。
#
# 与 e4e_7088.conf 并存：同一 7088 ssl 端口用不同 server_name(SNI) 区分站点。
#   e4e/bead-forge 留在 www.hnhlsa.com:7088；本文件用 intramind.hnhlsa.com:7088。
#   二者 server_name 必须不同（同端口 + 同 server_name 时 nginx 只认先加载者，另一个被忽略）。
# 复用同一份证书 /etc/nginx/cert/www.hnhlsa.com.*（SAN 仅含 hnhlsa.com / www.hnhlsa.com，
#   不含 intramind.hnhlsa.com）→ 浏览器访问本站会提示"证书域名不匹配"，点"继续访问"即可。
#   要彻底消除告警，需换 SAN 覆盖该子域（如 *.hnhlsa.com 或新增 intramind.hnhlsa.com）的证书。
# 内网访问需让 intramind.hnhlsa.com 解析到 192.168.1.212；若要公网直达则解析到公网 117.158.206.8
#   （其已按 TCP 转发 7088 到本机，与 SNI 无关；nginx 再按 SNI 选中本 server）。
# 后端 190 是 http 且无证书，代理段保持 http（内网，不做 SSL 卸载以外的加密）。

server {
    listen 9999 ssl;
    server_name wwww.hnhlsa.com;

    ssl_certificate       /etc/nginx/cert/www.hnhlsa.com.pem;
    ssl_certificate_key   /etc/nginx/cert/www.hnhlsa.com.key;

    ssl_session_cache     shared:SSL:1m;
    ssl_session_timeout   5m;
    ssl_ciphers           HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 需 >= 后端 MAX_FILE_SIZE_MB（后端当前 50M），与 e4e 站点一致给 100M
    client_max_body_size 100M;

    # 启用 gzip 压缩静态资源 (前端 index.js 单文件 ~1MB, gzip 后约 200-300KB)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml application/rss+xml image/svg+xml font/ttf font/otf;

    # 安全头配置
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 日志（server 级独立文件，便于与 e4e 站点区分排查）
    error_log /var/log/nginx/weknora_error.log warn;
    access_log /var/log/nginx/weknora_access.log;

    # ========== 后端代理目标 ==========
    # 190 上 app 宿主端口 8081（.env: APP_PORT=8081 → 容器内 8080）；
    # 后端换机器/端口时只改下面三处 192.168.1.190:8081。

    # 前端静态文件（SPA）
    location / {
        root /etc/nginx/html/intramind;
        index index.html;
        try_files $uri $uri/ /index.html;

        # index.html 及 SPA fallback 不可缓存，否则前端升级后用户看不到新版本
        add_header Cache-Control "no-cache, must-revalidate" always;
        # nginx add_header 不从上层继承，需要在 location 内重复声明安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Vite 构建产物 /assets/* 带 hash 文件名，可长期缓存
    location ^~ /assets/ {
        root /etc/nginx/html/intramind;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 本地存储文件代理到后端服务（用于渲染 markdown 中的图片）
    # 精确匹配 /files，避免 Nginx 自动补 / 触发 301
    location = /files {
        proxy_pass http://192.168.1.190:8081/files;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 资源能力短链 /r/<token>：IM 渠道渲染 resource:// 图片依赖此路由，
    # 缺此段会落进 SPA fallback 返回空白页，图片加载不出来。
    location ^~ /r/ {
        proxy_pass http://192.168.1.190:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 请求代理到 190 上的后端服务
    location /api/ {
        proxy_pass http://192.168.1.190:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 连接和重试配置（后端是局域网远程机器，保留重试）
        proxy_connect_timeout 30s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;

        # SSE 相关配置（问答流式输出依赖）
        proxy_http_version 1.1;
        proxy_set_header Connection "";            # 禁用 Connection: close，保持连接打开
        chunked_transfer_encoding off;
        proxy_buffering off;                        # 关闭缓冲
        proxy_cache off;                            # 关闭缓存
        proxy_read_timeout 3600s;                   # 长任务（文档解析等）长超时
        proxy_send_timeout 3600s;
    }

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /etc/nginx/html/intramind;
    }
}
